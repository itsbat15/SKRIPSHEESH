<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; overflow: hidden; width: 1820px; height: 980px; }
  svg { display: block; width: 1820px; height: 980px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 980" width="1820" height="980">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000000; }
      .sub-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #555555; }
      .legend-box { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #000000; text-anchor: middle; }
      .ent-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .rel-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .card-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .line-solid { stroke: #000000; stroke-width: 1.6; fill: none; }
      .box-ent { fill: #ffffff; stroke: #000000; stroke-width: 1.8; }
      .box-rel { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1820" height="980" fill="#ffffff" />

  <!-- Header: Title & Legend -->
  <text x="50" y="40" class="title">Entity Relationship Diagram (ERD) - Notasi Peter Chen</text>
  <text x="50" y="60" class="sub-title">Pemodelan Konseptual Basis Data Relasional Sistem Informasi ARTHA (Entitas, Relasi, dan Kardinalitas)</text>
  <g transform="translate(1000, 24)">
    <rect width="770" height="40" rx="4" ry="4" fill="#FAFAFA" stroke="#000000" stroke-width="1.2" />
    <text x="385" y="24" class="legend-box">Standar Notasi Peter Chen (1976): &#160; [ Persegi Panjang ] = Entitas &#160;|&#160; &lt; Belah Ketupat &gt; = Relasi &#160;|&#160; 1 / N = Rasio Kardinalitas</text>
  </g>

  <!-- ================= 14 RELATIONSHIP LINES & PATHS ================= -->
  <!-- 1. branches -[1]- <Mengelola> -[N]- study_groups -->
  <line x1="690" y1="180" x2="990" y2="180" class="line-solid" />
  <rect x="705" y="156" width="20" height="20" fill="#ffffff" />
  <text x="715" y="166" class="card-label">1</text>
  <rect x="955" y="156" width="20" height="20" fill="#ffffff" />
  <text x="965" y="166" class="card-label">N</text>
  <!-- 2. branches -[1]- <Menaungi> -[N]- students -->
  <line x1="620" y1="202.5" x2="620" y2="397.5" class="line-solid" />
  <rect x="626" y="215" width="20" height="20" fill="#ffffff" />
  <text x="636" y="225" class="card-label">1</text>
  <rect x="626" y="365" width="20" height="20" fill="#ffffff" />
  <text x="636" y="375" class="card-label">N</text>
  <!-- 3. study_groups -[1]- <Ditempati> -[N]- enrollments -->
  <line x1="1060" y1="202.5" x2="1060" y2="397.5" class="line-solid" />
  <rect x="1066" y="215" width="20" height="20" fill="#ffffff" />
  <text x="1076" y="225" class="card-label">1</text>
  <rect x="1066" y="365" width="20" height="20" fill="#ffffff" />
  <text x="1076" y="375" class="card-label">N</text>
  <!-- 4. students -[1]- <Mengambil> -[N]- enrollments -->
  <line x1="690" y1="420" x2="990" y2="420" class="line-solid" />
  <rect x="705" y="396" width="20" height="20" fill="#ffffff" />
  <text x="715" y="406" class="card-label">1</text>
  <rect x="955" y="396" width="20" height="20" fill="#ffffff" />
  <text x="965" y="406" class="card-label">N</text>
  <!-- 5. enrollments -[1]- <Menerbitkan> -[N]- tuition_bills -->
  <line x1="1060" y1="442.5" x2="1060" y2="637.5" class="line-solid" />
  <rect x="1066" y="455" width="20" height="20" fill="#ffffff" />
  <text x="1076" y="465" class="card-label">1</text>
  <rect x="1066" y="605" width="20" height="20" fill="#ffffff" />
  <text x="1076" y="615" class="card-label">N</text>
  <!-- 6. tuition_bills -[1]- <Diselesaikan> -[N]- payments -->
  <line x1="1130" y1="660" x2="1450" y2="660" class="line-solid" />
  <rect x="1145" y="636" width="20" height="20" fill="#ffffff" />
  <text x="1155" y="646" class="card-label">1</text>
  <rect x="1415" y="636" width="20" height="20" fill="#ffffff" />
  <text x="1425" y="646" class="card-label">N</text>
  <!-- 7. payments -[1]- <Melampirkan> -[1]- payment_proofs -->
  <line x1="1520" y1="682.5" x2="1520" y2="877.5" class="line-solid" />
  <rect x="1526" y="695" width="20" height="20" fill="#ffffff" />
  <text x="1536" y="705" class="card-label">1</text>
  <rect x="1526" y="845" width="20" height="20" fill="#ffffff" />
  <text x="1536" y="855" class="card-label">1</text>
  <!-- 8. users -[1]- <Melakukan> -[N]- daily_reconciliations -->
  <line x1="240" y1="442.5" x2="240" y2="637.5" class="line-solid" />
  <rect x="246" y="455" width="20" height="20" fill="#ffffff" />
  <text x="256" y="465" class="card-label">1</text>
  <rect x="246" y="605" width="20" height="20" fill="#ffffff" />
  <text x="256" y="615" class="card-label">N</text>
  <!-- 9. branches -[1]- <Memiliki> -[N]- users -->
  <line x1="550" y1="195" x2="310" y2="405" class="line-solid" />
  <rect x="525" y="205" width="20" height="20" fill="#ffffff" />
  <text x="535" y="215" class="card-label">1</text>
  <rect x="315" y="375" width="20" height="20" fill="#ffffff" />
  <text x="325" y="385" class="card-label">N</text>
  <!-- 10. course_packages -[1]- <Ditawarkan> -[N]- enrollments -->
  <line x1="1445" y1="195" x2="1130" y2="405" class="line-solid" />
  <rect x="1415" y="205" width="20" height="20" fill="#ffffff" />
  <text x="1425" y="215" class="card-label">1</text>
  <rect x="1140" y="375" width="20" height="20" fill="#ffffff" />
  <text x="1150" y="385" class="card-label">N</text>
  <!-- 11. branches -[1]- <Mengadakan> -[N]- daily_reconciliations -->
  <path d="M 620 157.5 L 620 95 L 80 95 L 80 660 L 155 660" class="line-solid" />
  <rect x="570" y="75" width="20" height="20" fill="#ffffff" />
  <text x="580" y="85" class="card-label">1</text>
  <rect x="125" y="636" width="20" height="20" fill="#ffffff" />
  <text x="135" y="646" class="card-label">N</text>
  <!-- 12. branches -[1]- <Menerima> -[N]- payments -->
  <path d="M 620 157.5 L 620 95 L 1720 95 L 1720 660 L 1590 660" class="line-solid" />
  <rect x="650" y="75" width="20" height="20" fill="#ffffff" />
  <text x="660" y="85" class="card-label">1</text>
  <rect x="1605" y="636" width="20" height="20" fill="#ffffff" />
  <text x="1615" y="646" class="card-label">N</text>
  <!-- 13. users -[1]- <Melayani> -[N]- payments -->
  <path d="M 310 435 L 360 435 L 360 540 L 1440 540 L 1440 637.5" class="line-solid" />
  <rect x="370" y="435" width="20" height="20" fill="#ffffff" />
  <text x="380" y="445" class="card-label">1</text>
  <rect x="1445" y="615" width="20" height="20" fill="#ffffff" />
  <text x="1455" y="625" class="card-label">N</text>
  <!-- 14. users -[1]- <Memvalidasi> -[N]- payment_proofs -->
  <path d="M 240 682.5 L 240 900 L 1445 900" class="line-solid" />
  <rect x="246" y="695" width="20" height="20" fill="#ffffff" />
  <text x="256" y="705" class="card-label">1</text>
  <rect x="1415" y="876" width="20" height="20" fill="#ffffff" />
  <text x="1425" y="886" class="card-label">N</text>

  <!-- ================= 14 RELATIONSHIP DIAMONDS ================= -->
  <polygon points="840,155.0 895.0,180 840,205.0 785.0,180" class="box-rel" />
  <text x="840" y="180" class="rel-label">Mengelola</text>
  <polygon points="430,275.0 485.0,300 430,325.0 375.0,300" class="box-rel" />
  <text x="430" y="300" class="rel-label">Memiliki</text>
  <polygon points="620,275.0 675.0,300 620,325.0 565.0,300" class="box-rel" />
  <text x="620" y="300" class="rel-label">Menaungi</text>
  <polygon points="1060,275.0 1115.0,300 1060,325.0 1005.0,300" class="box-rel" />
  <text x="1060" y="300" class="rel-label">Ditempati</text>
  <polygon points="1290,275.0 1345.0,300 1290,325.0 1235.0,300" class="box-rel" />
  <text x="1290" y="300" class="rel-label">Ditawarkan</text>
  <polygon points="840,395.0 895.0,420 840,445.0 785.0,420" class="box-rel" />
  <text x="840" y="420" class="rel-label">Mengambil</text>
  <polygon points="240,515.0 295.0,540 240,565.0 185.0,540" class="box-rel" />
  <text x="240" y="540" class="rel-label">Melakukan</text>
  <polygon points="1060,515.0 1117.5,540 1060,565.0 1002.5,540" class="box-rel" />
  <text x="1060" y="540" class="rel-label">Menerbitkan</text>
  <polygon points="1360,515.0 1415.0,540 1360,565.0 1305.0,540" class="box-rel" />
  <text x="1360" y="540" class="rel-label">Melayani</text>
  <polygon points="1290,635.0 1347.5,660 1290,685.0 1232.5,660" class="box-rel" />
  <text x="1290" y="660" class="rel-label">Diselesaikan</text>
  <polygon points="1520,755.0 1577.5,780 1520,805.0 1462.5,780" class="box-rel" />
  <text x="1520" y="780" class="rel-label">Melampirkan</text>
  <polygon points="1220,875.0 1275.0,900 1220,925.0 1165.0,900" class="box-rel" />
  <text x="1220" y="900" class="rel-label">Memvalidasi</text>
  <polygon points="80,395.0 135.0,420 80,445.0 25.0,420" class="box-rel" />
  <text x="80" y="420" class="rel-label">Mengadakan</text>
  <polygon points="1720,395.0 1775.0,420 1720,445.0 1665.0,420" class="box-rel" />
  <text x="1720" y="420" class="rel-label">Menerima</text>

  <!-- ================= 10 ENTITY RECTANGLES ================= -->
  <rect x="550.0" y="157.5" width="140" height="45" class="box-ent" />
  <text x="620" y="180" class="ent-label">branches</text>
  <rect x="990.0" y="157.5" width="140" height="45" class="box-ent" />
  <text x="1060" y="180" class="ent-label">study_groups</text>
  <rect x="1445.0" y="157.5" width="150" height="45" class="box-ent" />
  <text x="1520" y="180" class="ent-label">course_packages</text>
  <rect x="170.0" y="397.5" width="140" height="45" class="box-ent" />
  <text x="240" y="420" class="ent-label">users</text>
  <rect x="550.0" y="397.5" width="140" height="45" class="box-ent" />
  <text x="620" y="420" class="ent-label">students</text>
  <rect x="990.0" y="397.5" width="140" height="45" class="box-ent" />
  <text x="1060" y="420" class="ent-label">enrollments</text>
  <rect x="155.0" y="637.5" width="170" height="45" class="box-ent" />
  <text x="240" y="660" class="ent-label">daily_reconciliations</text>
  <rect x="990.0" y="637.5" width="140" height="45" class="box-ent" />
  <text x="1060" y="660" class="ent-label">tuition_bills</text>
  <rect x="1450.0" y="637.5" width="140" height="45" class="box-ent" />
  <text x="1520" y="660" class="ent-label">payments</text>
  <rect x="1445.0" y="877.5" width="150" height="45" class="box-ent" />
  <text x="1520" y="900" class="ent-label">payment_proofs</text>
</svg>

</body>
</html>

2042.96" text-anchor="middle" font-family="Times New Roman,serif" font-size="28" font-weight="normal" fill="#202020">Relasi rekening, pengguna pemeriksa, mata pelajaran, dan jejak aktivitas dirinci pada ERD lengkap.</text></svg>
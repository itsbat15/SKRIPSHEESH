an.</text><text x="900" y="1387.96" text-anchor="middle" font-family="Times New Roman,serif" font-size="28" font-weight="normal" fill="#202020">Pencocokan manual tanpa API bank; tidak memerlukan layanan pengiriman WhatsApp otomatis.</text></svg>
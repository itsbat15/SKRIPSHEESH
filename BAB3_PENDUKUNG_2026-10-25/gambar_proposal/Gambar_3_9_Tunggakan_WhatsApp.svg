enerima: nomor wali terdaftar, ditampilkan tersamar pada gambar ini.</text><rect x="340" y="640" width="1390" height="205" rx="8" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="2"/><text x="365" y="687.96" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#202020">Bapak/Ibu wali Siswa Contoh 03, tagihan SPP periode Oktober 2026</text><text x="365" y="737.96" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#202020">sebesar Rp300.000 telah jatuh tempo pada 20 Oktober 2026.</text><text x="365" y="787.96" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#202020">Mohon konfirmasi pembayaran kepada Admin Cabang. Terima kasih.</text><rect x="315" y="940" width="520" height="52" rx="8" fill="#333333" stroke="#777777" stroke-width="2"/><text x="575.0" y="971.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Buka WhatsApp dengan pesan ini</text><text x="870" y="964.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#202020">Admin memeriksa dan mengirim di WhatsApp.</text><text x="315" y="1040.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#202020">Catatan sistem: tautan dibuka. Status pesan terkirim atau dibaca tidak diketahui sistem.</text></svg>
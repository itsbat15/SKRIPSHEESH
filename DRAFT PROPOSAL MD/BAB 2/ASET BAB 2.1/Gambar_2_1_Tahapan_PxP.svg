<svg width="920" height="980" viewBox="0 0 920 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Canvas -->
  <rect width="920" height="980" fill="#FFFFFF"/>

  <!-- Top Right Title: PXP -->
  <text x="760" y="75" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="2">PXP</text>

  <!-- ==================== MAIN VERTICAL PHASES ==================== -->

  <!-- Phase 1: Requirements -->
  <rect x="200" y="45" width="340" height="52" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="370" y="77" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Requirements</text>

  <!-- Arrow: Requirements -> Planning -->
  <line x1="370" y1="97" x2="370" y2="135" stroke="#1E293B" stroke-width="2"/>
  <polygon points="364,133 370,143 376,133" fill="#1E293B"/>

  <!-- Phase 2: Planning -->
  <rect x="200" y="145" width="340" height="52" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="370" y="177" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Planning</text>

  <!-- ==================== ITERATION CONTAINER ==================== -->
  <rect x="80" y="235" width="530" height="615" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8"/>

  <!-- Arrow: Planning -> Iteration Initialization -->
  <line x1="370" y1="197" x2="370" y2="257" stroke="#1E293B" stroke-width="2"/>
  <polygon points="364,255 370,265 376,255" fill="#1E293B"/>

  <!-- Phase 3: Iteration Initialization -->
  <rect x="200" y="267" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="370" y="299" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Iteration Initialization</text>

  <!-- Arrow: Init -> Design -->
  <line x1="370" y1="319" x2="370" y2="357" stroke="#1E293B" stroke-width="2"/>
  <polygon points="364,355 370,365 376,355" fill="#1E293B"/>

  <!-- Phase 4: Design -->
  <rect x="200" y="367" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="370" y="399" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Design</text>

  <!-- Arrow: Design -> Implementation -->
  <line x1="370" y1="419" x2="370" y2="457" stroke="#1E293B" stroke-width="2"/>
  <polygon points="364,455 370,465 376,455" fill="#1E293B"/>

  <!-- Phase 5: Implementation (Compound Container) -->
  <rect x="150" y="467" width="440" height="135" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="370" y="493" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Implementation</text>

  <!-- Sub-step 5a: Unit Testing -->
  <rect x="175" y="510" width="110" height="68" rx="6" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="540" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Unit</text>
  <text x="230" y="558" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Testing</text>

  <!-- Arrow: Unit Testing -> Code -->
  <line x1="285" y1="544" x2="320" y2="544" stroke="#334155" stroke-width="1.8"/>
  <polygon points="318,539 328,544 318,549" fill="#334155"/>

  <!-- Sub-step 5b: Code -->
  <rect x="330" y="510" width="95" height="68" rx="6" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="377" y="550" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Code</text>

  <!-- Arrow: Code -> Refactor -->
  <line x1="425" y1="544" x2="460" y2="544" stroke="#334155" stroke-width="1.8"/>
  <polygon points="458,539 468,544 458,549" fill="#334155"/>

  <!-- Sub-step 5c: Refactor -->
  <rect x="470" y="510" width="95" height="68" rx="6" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="517" y="550" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Refactor</text>

  <!-- Arrow: Implementation -> System Testing -->
  <line x1="370" y1="602" x2="370" y2="630" stroke="#1E293B" stroke-width="2"/>
  <polygon points="364,628 370,638 376,628" fill="#1E293B"/>

  <!-- Phase 6: System Testing -->
  <rect x="200" y="640" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="370" y="672" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">System Testing</text>

  <!-- Arrow: System Testing -> Retrospective -->
  <line x1="370" y1="692" x2="370" y2="720" stroke="#1E293B" stroke-width="2"/>
  <polygon points="364,718 370,728 376,718" fill="#1E293B"/>

  <!-- Phase 7: Retrospective -->
  <rect x="200" y="730" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="370" y="762" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Retrospective</text>

  <!-- ==================== ITERATION LOOPBACK (DASHED) ==================== -->
  <polyline points="200,756 135,756 135,293 190,293" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6,5"/>
  <polygon points="188,287 198,293 188,299" fill="#64748B"/>

  <!-- ==================== LOGS CYLINDER & CONNECTIONS ==================== -->

  <!-- LOGS Cylinder (Vector Database) -->
  <!-- Bottom Ellipse -->
  <ellipse cx="760" cy="530" rx="65" ry="18" fill="#E2E8F0" stroke="#334155" stroke-width="2"/>
  <!-- Body -->
  <path d="M 695 425 L 695 530 A 65 18 0 0 0 825 530 L 825 425 Z" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <!-- Top Ellipse -->
  <ellipse cx="760" cy="425" rx="65" ry="18" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <!-- LOGS Label -->
  <text x="760" y="488" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="2">LOGS</text>

  <!-- Dashed Connectors to LOGS -->
  <!-- 1. Planning -> LOGS -->
  <path d="M 540 171 L 620 171 L 710 410" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5,5"/>
  <polygon points="704,404 714,414 711,400" fill="#64748B"/>

  <!-- 2. Implementation -> LOGS -->
  <path d="M 590 535 L 685 480" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5,5"/>
  <polygon points="678,487 689,478 684,494" fill="#64748B"/>

  <!-- 3. System Testing -> LOGS -->
  <path d="M 540 666 L 620 666 L 695 528" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5,5"/>
  <polygon points="693,539 698,524 686,532" fill="#64748B"/>

  <!-- 4. Retrospective -> LOGS -->
  <path d="M 540 756 L 650 756 L 715 540" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5,5"/>
  <polygon points="713,553 717,536 706,547" fill="#64748B"/>

  <!-- ==================== BOTTOM CAPTIONS ==================== -->
  <text x="345" y="895" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Fig. 1. PXP process phases.</text>
  <text x="345" y="920" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-style="italic" fill="#64748B" text-anchor="middle">Sumber: Diadaptasi dan digambar ulang dari Dzhurov, Krasteva, dan Ilieva (2009)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #000; text-anchor: middle; }
      .actor-title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #000; text-anchor: middle; }
      .actor-sub { font-family: 'Arial', sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
      .uc-text { font-family: 'Arial', sans-serif; font-size: 12.5px; fill: #000; text-anchor: middle; font-weight: 500; }
      .rel-label { font-family: 'Arial', sans-serif; font-size: 11.5px; fill: #111; font-style: italic; text-anchor: middle; font-weight: 600; }
      .footnote { font-family: 'Arial', sans-serif; font-size: 12px; font-style: italic; fill: #555; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="980" fill="#ffffff" />

  <!-- System Boundary Box -->
  <rect x="220" y="35" width="760" height="895" rx="4" ry="4" fill="#fafafa" stroke="#000000" stroke-width="2" />
  <text x="600" y="65" class="title">Sistem Informasi Manajemen Bimbel ARTHA</text>

  <!-- ================= ACTORS ================= -->
  <!-- Left Actor: Admin (Staf Administrasi Cabang) -->
  <g id="actor-staf" transform="translate(110, 390)">
    <!-- Stick Figure -->
    <circle cx="0" cy="0" r="18" fill="#fff" stroke="#000" stroke-width="2" />
    <line x1="0" y1="18" x2="0" y2="70" stroke="#000" stroke-width="2" />
    <line x1="-35" y1="35" x2="35" y2="35" stroke="#000" stroke-width="2" />
    <line x1="0" y1="70" x2="-25" y2="120" stroke="#000" stroke-width="2" />
    <line x1="0" y1="70" x2="25" y2="120" stroke="#000" stroke-width="2" />
    <!-- Label -->
    <text x="0" y="145" class="actor-title">Admin</text>
    <text x="0" y="165" class="actor-sub">(Staf Administrasi Cabang)</text>
  </g>

  <!-- Right Actor: Super Admin (Pemilik Lembaga) -->
  <g id="actor-admin" transform="translate(1090, 490)">
    <!-- Stick Figure -->
    <circle cx="0" cy="0" r="18" fill="#fff" stroke="#000" stroke-width="2" />
    <line x1="0" y1="18" x2="0" y2="70" stroke="#000" stroke-width="2" />
    <line x1="-35" y1="35" x2="35" y2="35" stroke="#000" stroke-width="2" />
    <line x1="0" y1="70" x2="-25" y2="120" stroke="#000" stroke-width="2" />
    <line x1="0" y1="70" x2="25" y2="120" stroke="#000" stroke-width="2" />
    <!-- Label -->
    <text x="0" y="145" class="actor-title">Super Admin</text>
    <text x="0" y="165" class="actor-sub">(Pemilik Lembaga)</text>
  </g>

  <!-- ================= USE CASES (OVALS) ================= -->
  <!-- UC-01: Autentikasi (Top Middle, shared) -->
  <g id="uc-01">
    <ellipse cx="600" cy="120" rx="130" ry="26" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="600" y="125" class="uc-text">Melakukan Autentikasi Masuk</text>
  </g>

  <!-- UC-02: Mendaftarkan Siswa Baru (Left Column) -->
  <g id="uc-02">
    <ellipse cx="385" cy="220" rx="125" ry="26" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="385" y="225" class="uc-text">Mendaftarkan Siswa Baru</text>
  </g>

  <!-- UC-03: Memvalidasi Kuota Kelas (Center-Right from UC-02) -->
  <g id="uc-03">
    <ellipse cx="815" cy="220" rx="125" ry="26" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="815" y="225" class="uc-text">Memvalidasi Kuota Kelas</text>
  </g>

  <!-- UC-04: Mencatat Pembayaran Kasir Cabang (Left Column) -->
  <g id="uc-04">
    <ellipse cx="385" cy="335" rx="130" ry="28" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="385" y="331" class="uc-text">Mencatat Pembayaran</text>
    <text x="385" y="347" class="uc-text">Kasir Cabang</text>
  </g>

  <!-- UC-05: Mengunggah Bukti Transfer Bank (Center-Right from UC-04) -->
  <g id="uc-05">
    <ellipse cx="815" cy="335" rx="130" ry="26" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="815" y="340" class="uc-text">Mengunggah Bukti Transfer Bank</text>
  </g>

  <!-- UC-06: Mencetak Kuitansi Pembayaran (PDF) (Center Column - Shared) -->
  <g id="uc-06">
    <ellipse cx="600" cy="445" rx="135" ry="26" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="600" y="450" class="uc-text">Mencetak Kuitansi Pembayaran (PDF)</text>
  </g>

  <!-- UC-11: Memantau Tunggakan & Jatuh Tempo SPP (Center Column - Shared) -->
  <g id="uc-11">
    <ellipse cx="600" cy="550" rx="135" ry="28" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="600" y="546" class="uc-text">Memantau Tunggakan &amp;</text>
    <text x="600" y="562" class="uc-text">Jatuh Tempo SPP</text>
  </g>

  <!-- UC-07: Melakukan Rekonsiliasi Kas Harian (Left Column - Admin) -->
  <g id="uc-07">
    <ellipse cx="385" cy="670" rx="130" ry="26" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="385" y="675" class="uc-text">Melakukan Rekonsiliasi Kas Harian</text>
  </g>

  <!-- UC-08: Mengelola Pengguna dan Cabang (Right Column - Super Admin) -->
  <g id="uc-08">
    <ellipse cx="815" cy="640" rx="130" ry="26" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="815" y="645" class="uc-text">Mengelola Pengguna dan Cabang</text>
  </g>

  <!-- UC-09: Mengatur Ketentuan Kuota Kelas (Right Column - Super Admin) -->
  <g id="uc-09">
    <ellipse cx="815" cy="720" rx="130" ry="26" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="815" y="725" class="uc-text">Mengatur Ketentuan Kuota Kelas</text>
  </g>

  <!-- UC-10: Memvalidasi Pembayaran Transfer Bank (Right Column - Super Admin) -->
  <g id="uc-10">
    <ellipse cx="815" cy="800" rx="135" ry="28" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="815" y="796" class="uc-text">Memvalidasi Pembayaran</text>
    <text x="815" y="812" class="uc-text">Transfer Bank</text>
  </g>

  <!-- UC-12: Melihat Dashboard Konsolidasi Keuangan (Right Column - Super Admin) -->
  <g id="uc-12">
    <ellipse cx="815" cy="880" rx="135" ry="28" fill="#ffffff" stroke="#000" stroke-width="1.6" />
    <text x="815" y="876" class="uc-text">Melihat Dashboard</text>
    <text x="815" y="892" class="uc-text">Konsolidasi Keuangan</text>
  </g>

  <!-- Footnote -->
  <text x="600" y="950" class="footnote">Kuitansi hanya dapat dicetak untuk transaksi yang telah berstatus lunas (paid).</text>

  <!-- ================= ASSOCIATIONS (SOLID LINES) ================= -->
  <!-- From Admin (center: 110, 425) -->
  <line x1="145" y1="410" x2="475" y2="125" stroke="#000" stroke-width="1.5" />
  <line x1="145" y1="418" x2="260" y2="220" stroke="#000" stroke-width="1.5" />
  <line x1="145" y1="425" x2="255" y2="335" stroke="#000" stroke-width="1.5" />
  <line x1="145" y1="432" x2="465" y2="445" stroke="#000" stroke-width="1.5" />
  <line x1="145" y1="440" x2="465" y2="550" stroke="#000" stroke-width="1.5" />
  <line x1="145" y1="450" x2="255" y2="670" stroke="#000" stroke-width="1.5" />

  <!-- From Super Admin (center: 1090, 525) -->
  <line x1="1055" y1="500" x2="725" y2="125" stroke="#000" stroke-width="1.5" />
  <line x1="1055" y1="508" x2="735" y2="445" stroke="#000" stroke-width="1.5" />
  <line x1="1055" y1="516" x2="735" y2="550" stroke="#000" stroke-width="1.5" />
  <line x1="1055" y1="525" x2="945" y2="640" stroke="#000" stroke-width="1.5" />
  <line x1="1055" y1="535" x2="945" y2="720" stroke="#000" stroke-width="1.5" />
  <line x1="1055" y1="545" x2="950" y2="800" stroke="#000" stroke-width="1.5" />
  <line x1="1055" y1="555" x2="950" y2="880" stroke="#000" stroke-width="1.5" />

  <!-- ================= INCLUDE & EXTEND (DASHED ARROWS) ================= -->
  <!-- 1. UC-02 <<include>> UC-03 -->
  <line x1="510" y1="220" x2="690" y2="220" stroke="#000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="565" y="205" width="70" height="16" fill="#ffffff" />
  <text x="600" y="217" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- 2. UC-05 <<extend>> UC-04 -->
  <line x1="685" y1="335" x2="515" y2="335" stroke="#000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="565" y="322" width="70" height="16" fill="#ffffff" />
  <text x="600" y="334" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

</svg>